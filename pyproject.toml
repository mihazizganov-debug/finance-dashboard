[tool.poetry]
name = "finance-dashboard"
version = "0.1.0"
description = "Финансовый дашборд"
authors = ["MikhailZizganov <mihazizganov@gmail.com>"]

[tool.poetry.dependencies]
python = "^3.11"
pandas = "^2.3.3"
numpy = "^2.4.0"
matplotlib = "^3.10.8"
openpyxl = "^3.1.5"
requests = "^2.32.5"
httpx = "^0.28.1"
python-dateutil = "^2.9.0"
pytz = "^2025.2"
tzdata = "^2025.3"
pillow = "^12.0.0"
python-dotenv = "^1.0.0"

[tool.poetry.group.dev.dependencies]
black = "^25.12.0"
flake8 = "^7.3.0"
pytest = "^9.0.2"
pytest-cov = "^7.0.0"
mypy-extensions = "^1.1.0"
isort = "^7.0.0"
mypy = "^1.15.0"  # <-- ДОБАВЬТЕ ЭТО!

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ============ КОНФИГУРАЦИЯ ЛИНТЕРОВ ============

[tool.black]
line-length = 119
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 119

[tool.mypy]
python_version = "3.11"
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ['venv']
disable_error_code = ["assignment", "call-overload"]